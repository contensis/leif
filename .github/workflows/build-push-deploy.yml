# =============================================================================
# Build & Deploy — leif (GitHub Actions)
#
# Test-bed for the new open-source CI shape (mirrors the c4c framework's
# build-publish-deploy.yml, minus publish and the quality gate — leif's lint
# and tests are not actively maintained). Replaces the legacy trio:
# build.yml (ghcr builder/app images), release.yml (release-* retag),
# push-block.yml (contensis/block-push@v1) — all deleted.
#
# Nothing here deploys: GitHub builds the image, pushes it to the PRIVATE
# leif-deployments GitLab project registry, and triggers that project's
# deploy pipeline (see .gitlab-ci.yml there), which pushes the block to
# Contensis via the ops push-block template.
#
# Jobs:
#   meta            classify the push: release vs routine (pushes only)
#   container       build image, push to GitLab registry  (pushes only)
#   trigger-deploy  call the leif-deployments trigger API (pushes only)
#
# Release semantics match c4c: a commit on the release branch titled exactly
# `vX.Y.Z` is a release (DEPLOY_INTENT=release); every other branch push is
# internal. Manual workflow_dispatch runs deploy as internal.
#
# Required GitHub SECRETS (create at repo setup — TODO):
#   GITLAB_REGISTRY_HOST
#       Our GitLab registry endpoint: `hostname:port`, no scheme. Not
#       sensitive — kept as a secret purely so the internal hostname stays
#       out of this public file (GitHub masks secrets in logs).
#   GITLAB_REGISTRY_USERNAME / GITLAB_REGISTRY_PASSWORD
#       Deploy token on the leif-deployments GitLab project, scopes
#       read_registry + write_registry — GitLab requires BOTH to push, even
#       though only write_registry feels relevant. Still not a PAT.
#       TODO: set an expiry date; rotate.
#   GITLAB_TRIGGER_TOKEN
#       Pipeline trigger token on the leif-deployments project.
#       TODO: set an expiry date; rotate.
#
# The GitLab target — project ID 1174, ref main — is hardcoded below. It is
# not sensitive: the token still decides what a run may do, and the deploy
# pipeline's own rules decide what may actually deploy.
# =============================================================================
name: Build & Deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Release branch — same commit-title release convention as c4c.
  RELEASE_BRANCH: master
  # GitLab project the images land in and the deploy pipeline lives on.
  GITLAB_DEPLOY_REPO: n.flatley/leif-deployments

jobs:
  # ---------------------------------------------------------------------------
  # Classify the push. A commit titled exactly vX.Y.Z on the release branch is
  # a release; everything else is routine/internal.
  # ---------------------------------------------------------------------------
  meta:
    name: Classify push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.detect.outputs.is-release }}
    steps:
      - name: Detect release commit
        id: detect
        env:
          # head_commit is null on workflow_dispatch → treated as routine.
          MESSAGE: ${{ github.event.head_commit.message }}
          REF: ${{ github.ref_name }}
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
        run: |
          title=$(printf '%s\n' "$MESSAGE" | head -n 1)
          if [ "$REF" = "$RELEASE_BRANCH" ] && printf '%s' "$title" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build the image and push it to the leif-deployments project registry.
  #
  # The image path is deliberately hardcoded end-to-end EXCEPT the branch and
  # the build number — it must land inside the leif-deployments project
  # registry that the deploy pipeline validates against. Two tags per build:
  #   app:build-<n>  the deploy tag — immutable, and the only kind the deploy
  #                  pipeline accepts (Contensis binds image:tag to a block on
  #                  first push, so a deployed tag is never re-pushed).
  #   app:latest     convenience tag, moved on every build of the branch —
  #                  never handed to a deploy.
  # ---------------------------------------------------------------------------
  container:
    name: Build & push container image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compose image URIs
        id: image
        env:
          GITLAB_REGISTRY_HOST: ${{ secrets.GITLAB_REGISTRY_HOST }}
          BRANCH: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          # TODO: ref_name is used verbatim in the repository path — uppercase
          # or other characters invalid in Docker repo names (and `~`) will
          # break the push. Sanitise here, or restrict which branches build
          # images, before general use.
          base="${GITLAB_REGISTRY_HOST}/${GITLAB_DEPLOY_REPO}/${BRANCH}/app"
          echo "uri=${base}:build-${BUILD}" >> "$GITHUB_OUTPUT"
          echo "latest=${base}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitLab registry
        env:
          GITLAB_REGISTRY_HOST: ${{ secrets.GITLAB_REGISTRY_HOST }}
          GITLAB_REGISTRY_USERNAME: ${{ secrets.GITLAB_REGISTRY_USERNAME }}
          GITLAB_REGISTRY_PASSWORD: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$GITLAB_REGISTRY_PASSWORD" \
            | docker login "$GITLAB_REGISTRY_HOST" -u "$GITLAB_REGISTRY_USERNAME" --password-stdin

      - name: Build image
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          LATEST_URI: ${{ steps.image.outputs.latest }}
        run: |
          # TODO: no layer caching yet — the legacy builder-image trick is
          # gone with the single-job build. Add buildx + registry cache if
          # build times become annoying.
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" -f docker/build.Dockerfile .

      - name: Push image
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          LATEST_URI: ${{ steps.image.outputs.latest }}
        run: |
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

  # ---------------------------------------------------------------------------
  # Hand the just-pushed image to the deploy pipeline. DEPLOY_INTENT decides
  # internal vs release; SOURCE_REF carries the GitHub branch so GitLab can
  # name the Contensis block branch after it (branch isolation depends on
  # this). Always the build-<n> tag — never :latest.
  # ---------------------------------------------------------------------------
  trigger-deploy:
    name: Trigger GitLab deploy pipeline
    needs: [meta, container]
    runs-on: ubuntu-latest
    env:
      GITLAB_REGISTRY_HOST: ${{ secrets.GITLAB_REGISTRY_HOST }}
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
      GITLAB_DEPLOY_PROJECT: "1174"   # leif-deployments on our GitLab
      GITLAB_DEPLOY_REF: main
      SOURCE_REF: ${{ github.ref_name }}
    steps:
      - name: Resolve deploy intent
        id: intent
        run: |
          if [ "${{ needs.meta.outputs.is-release }}" = "true" ]; then
            echo "value=release" >> "$GITHUB_OUTPUT"
          else
            echo "value=internal" >> "$GITHUB_OUTPUT"
          fi

      - name: Call the trigger API
        env:
          DEPLOY_INTENT: ${{ steps.intent.outputs.value }}
          BUILD: ${{ github.run_number }}
        run: |
          # Re-compose the URI from the same inputs the container job used.
          # It must NOT travel as a job output: GitHub redacts outputs that
          # contain secrets (the registry host is one) and sends nothing
          # downstream. Each job composes its own; run_number is shared.
          image_uri="${GITLAB_REGISTRY_HOST}/${GITLAB_DEPLOY_REPO}/${SOURCE_REF}/app:build-${BUILD}"
          # API host is the registry host without its port.
          api_host="${GITLAB_REGISTRY_HOST%%:*}"
          curl -sS --fail-with-body -X POST \
            "https://${api_host}/api/v4/projects/${GITLAB_DEPLOY_PROJECT}/trigger/pipeline" \
            -F "token=${GITLAB_TRIGGER_TOKEN}" \
            -F "ref=${GITLAB_DEPLOY_REF}" \
            -F "variables[IMAGE_URI]=${image_uri}" \
            -F "variables[DEPLOY_INTENT]=${DEPLOY_INTENT}" \
            -F "variables[SOURCE_REF]=${SOURCE_REF}"
